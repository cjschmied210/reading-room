  <title>Heartland by Edward Hirsch</title>

  <style>
:root {
  --paper: #FAF7F2;
  --paper-dark: #F0EAE1;
  --ink: #2C2825;
  --ink-muted: #767069;
  --accent: #C2593F;
  --accent-soft: #F7EBE8;
  --accent-light: #F2D6CD;
  --border: #E3DDD4;
  --font-heading: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  height: 4px;
  border-radius: 2px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 16px;
  width: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type=range]::-moz-range-thumb {
  height: 16px;
  width: 16px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
input[type=range]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.wrap {
  max-width: 1060px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 28px 64px;
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 14px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand {
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  font-family: var(--font-sans);
}
.pill {
  font-size: 12px;
  background: var(--paper-dark);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--ink-muted);
  font-family: var(--font-sans);
  font-weight: 500;
}
.topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn-ghost {
  font-size: 12px;
  font-family: var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-weight: 500;
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 6px;
  background: white;
  transition: color 0.15s, border-color 0.15s;
}
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
.btn-ghost.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

h1.doc-title {
  font-family: var(--font-heading);
  font-size: 42px;
  line-height: 1.15;
  margin: 28px 0;
  font-weight: 400;
  color: var(--ink);
}

.section-label {
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 12px;
  font-family: var(--font-sans);
  font-weight: 500;
}

.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}
.mode-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  padding: 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  transition: all 0.15s;
  color: var(--ink);
}
.mode-card:hover { border-color: var(--ink-muted); }
.mode-card.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.mode-title { font-family: var(--font-heading); font-size: 20px; font-weight: 500; line-height: 1; }
.mode-blurb { font-size: 12.5px; line-height: 1.4; color: var(--ink-muted); font-family: var(--font-sans); }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  align-items: center;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
  margin-bottom: 28px;
}
.transport { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn-primary {
  padding: 6px 16px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  transition: opacity 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink-muted);
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: color 0.15s, border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--ink); color: var(--ink); }
.progress-text { font-size: 12px; color: var(--ink-muted); font-family: var(--font-sans); min-width: 90px; }

.sliders { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-left: auto; }
.slider-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-muted); font-family: var(--font-sans); font-weight: 500;
}
.slider-label select {
  font-family: var(--font-sans);
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 6px;
  background: white;
  color: var(--ink);
  max-width: 180px;
}
.slider-value { font-size: 12px; text-transform: none; color: var(--ink); font-weight: 600; min-width: 45px; }

.stage {
  border: 1px solid var(--border);
  background: #FFFDF9;
  padding: 48px;
  min-height: 380px;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
@media (max-width: 640px) { .stage { padding: 32px 20px; } }

.stage-inner { margin: 0 auto; font-family: var(--font-body); }
.stage-inner p { margin-bottom: 20px; line-height: 1.75; }
.page-p { text-align: justify; -webkit-hyphens: auto; hyphens: auto; }

.word-token { display: inline-block; border-radius: 2px; padding: 0 2px; transition: all 90ms linear; }
.chunk-token { display: inline-block; border-radius: 2px; padding: 0 2px; transition: color 120ms ease, background 120ms ease; }

.word-stage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px; min-height: 260px; text-align: center; margin: auto 0;
}
.word-big {
  font-family: var(--font-heading);
  font-weight: 500;
  line-height: 1.1;
  color: var(--ink);
  border-bottom: 2px solid var(--accent);
  padding-bottom: 12px;
  min-height: 1.2em;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.01em;
  padding-left: 16px; padding-right: 16px;
}
.word-context {
  font-size: 14px; font-family: var(--font-sans); color: var(--ink-muted);
  max-width: 50ch; line-height: 1.5; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper); padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border);
}

.window-line { margin-bottom: 12px; color: var(--ink); padding-left: 16px; border-left: 3px solid transparent; transition: opacity 150ms ease, border-color 150ms ease; }

.hint-bar { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-top: 16px; }
.hint-text { font-size: 12px; color: var(--ink-muted); font-style: italic; font-family: var(--font-sans); }
.link-btn { font-size: 12px; font-family: var(--font-sans); color: var(--ink-muted); background: none; border: none; text-decoration: underline; transition: color 0.15s; }
.link-btn:hover { color: var(--accent); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(44,40,37,0.4); backdrop-filter: blur(2px);
  z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
  max-width: 640px; width: 100%; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.modal-head h3 { font-family: var(--font-heading); font-size: 24px; font-weight: 600; margin: 0; color: var(--ink); }
.modal-close { color: var(--ink-muted); background: none; border: none; font-size: 20px; font-weight: bold; }
.modal-close:hover { color: var(--ink); }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.preset-tag { font-size: 12px; font-family: var(--font-sans); background: white; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; transition: all 0.15s; }
.preset-tag:hover { border-color: var(--accent); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); font-weight: 500; }
.field input[type=text] {
  border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; background: white;
  font-family: var(--font-heading); font-size: 18px; color: var(--ink);
}
.field input[type=text]:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea {
  border: 1px solid var(--border); border-radius: 4px; padding: 12px; background: white;
  font-family: var(--font-body); font-size: 14px; color: var(--ink); line-height: 1.6; resize: vertical;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 8px; }

.locked-note {
  font-size: 12px; font-family: var(--font-sans); color: var(--ink-muted);
}

.page-word.on {
  background: var(--accent-soft);
  box-shadow: 0 2px 0 var(--accent);
  border-radius: 2px;
}

.window-line { cursor: pointer; }

.float-transport {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 40;
  padding: 10px 20px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22);
}

.site-footer {
  background: #ffffff; border-top: 3px solid #0f3d3e; flex-shrink: 0;
}
.site-footer-inner {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 12px; color: #1a1a1a;
}
.site-footer-mark { height: 28px; width: auto; flex-shrink: 0; }

window.__READER_DATA__ = {"title":"Heartland by Edward Hirsch","text":"Read these poems to yourself in the middle of the night. Turn on a single lamp and read them while you’re alone in an otherwise dark room or while someone else sleeps next to you. Read them when you’re wide awake in the early morning, fully alert. Say them over to yourself in a place where silence reigns and the din of the culture—the constant buzzing noise that surrounds us—has momentarily stopped. These poems have come from a great distance to find you. I think of Malebranche’s maxim, “Attentiveness is the natural prayer of the soul.” This maxim, beloved by Simone Weil and Paul Celan, quoted by Walter Benjamin in his magisterial essay on Franz Kafka, can stand as a writer’s credo. It also serves for readers. Paul Celan said:\n\nA poem, as a manifestation of language and thus essentially dialogue, can be a message in a bottle, sent out in the—not always greatly hopeful—belief that somewhere and sometime it could wash up on land, on heartland perhaps. Poems in this sense, too, are under way: they are making toward something.\n\nImagine you have gone down to the shore and there, amidst the other debris—the seaweed and rotten wood, the crushed cans and dead fish— you find an unlikely looking bottle from the past. You bring it home and discover a message inside. This letter, so strange and disturbing, seems to have been making its way toward someone for a long time, and now that someone turns out to be you. The great Russian poet Osip Mandelstam, destroyed in a Stalinist camp, identified this experience. “Why shouldn’t the poet turn to his friends, to those who are naturally close to him?” he asked in “On the Addressee.” But of course those friends aren’t necessarily the people around him in daily life. They may be the friends he only hopes exist, or will exist, the ones his words are seeking. Mandelstam wrote:\n\nAt a critical moment, a seafarer tosses a sealed bottle into the ocean waves, containi
