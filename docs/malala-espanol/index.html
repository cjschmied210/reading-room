  <script>
window.__READER_DATA__ = {"title":"I Am Malala — Fragmentos (Español)","text":"El martes 9 de octubre de 2012 no fue el mejor día para empezar, ya que estábamos en plena época de exámenes; aunque, como buena aficionada a los estudios, no me importaban tanto como a algunas de mis compañeras. Esa mañana llegamos al estrecho callejón de barro que sale de la calle Haji Baba en nuestra habitual procesión de rickshaws de colores brillantes que expulsaban humo diésel, cada uno repleto de cinco o seis chicas. Desde la época de los talibanes, nuestra escuela no tiene letrero y la puerta de latón ornamentada en una pared blanca no da ninguna pista de lo que hay dentro.\n\nPara nosotras, las chicas, esa puerta era como una entrada mágica a nuestro propio mundo especial. Al cruzarla, nos quitamos los pañuelos de la cabeza y subimos corriendo las escaleras a toda prisa. En lo alto había un patio abierto con puertas que daban a todas las aulas. Dejamos nuestras mochilas en nuestras habitaciones y nos reunimos para la asamblea bajo el cielo, de espaldas a las montañas.\n\nLa escuela fue fundada por mi padre antes de que yo naciera, y en la pared sobre nosotros, \"Escuela Khushal\" estaba pintado con orgullo en letras rojas y blancas. Íbamos a la escuela seis mañanas a la semana, y como yo estaba en noveno grado, mis clases consistían en recitar ecuaciones químicas o estudiar gramática urdu, escribir cuentos en inglés con moralejas como \"Las prisas no son buenas consejeras\" o dibujar diagramas de la circulación sanguínea; la mayoría de mis compañeros querían ser médicos. Es difícil imaginar que alguien pudiera ver eso como una amenaza. Sin embargo, fuera de la escuela no solo se extendía el ruido y la locura de Mingora, la ciudad principal de la provincia de Swat, sino también aquellos, como los talibanes, que piensan que las niñas no deberían ir a la escuela.\n\nComo era época de exámenes, las clases empezaron a las 9 en lugar de a las 8 de la mañana, lo cual fue bueno, ya que no me gusta levantarme y puedo dormir a pesar del canto de los gallos y la llamada a la oración del muecín.\n\nDormía en la habitación de la parte delantera de la casa. Los únicos muebles eran una cama y un armario que había comprado con el dinero que me dieron como premio por mi campaña por la paz en nuestro valle y el derecho de las niñas a ir a la escuela. En algunos estantes estaban los vasos y trofeos de plástico dorado que había ganado por ser la primera de mi clase. Hubo algunas veces que no quedé en primer lugar; en ambas ocasiones me ganó mi rival de clase, Malka-e-Noor. Estaba decidida a que no volviera a suceder.\n\nLa escuela no estaba lejos de mi casa y solía ir andando, pero desde principios del año pasado iba con otras chicas en bicitaxi y volvía a casa en autobús. Era un trayecto de cinco minutos junto al arroyo maloliente, pasando por la enorme valla publicitaria del Instituto de Trasplante Capilar del Dr. Humayun, donde bromeábamos diciendo que uno de nuestros profesores calvos debía de haber ido cuando de repente le empezó a crecer pelo. Me gustaba ir en autobús porque no sudaba tanto como cuando iba andando, y podía charlar con mis amigas y cotillear con Usman Ali, el conductor, a quien llamábamos Bhai Jan, o «hermano». Nos hacía reír a todas con sus historias disparatadas.\n\nEmpecé a tomar el autobús porque mi madre temía que caminara sola. Llevábamos todo el año recibiendo amenazas. Algunas salían en los periódicos y otras eran mensajes que nos llegaban de la gente. Me preocupaba más que los talibanes atacaran a mi padre, ya que siempre se manifestaba en contra de ellos. Su amigo y compañero activista, Zahid Khan, había recibido un disparo en la cara en agosto, cuando iba a rezar.\n\nA nuestra calle no se podía llegar en coche. Me bajaba del autobús en la calle de abajo, cruzaba una verja de hierro y subía unas escaleras. A veces me imaginaba que un terrorista podría saltar y dispararme allí mismo. Me preguntaba qué haría. Quizás me quitaría los zapatos y le pegaría. Pero luego pensaba que, si hacía eso, no habría diferencia entre un terrorista y yo. Sería mejor suplicar: «De acuerdo, dispárame, pero primero escúchame. Lo que haces está mal. No estoy en tu contra personalmente. Solo quiero que todas las niñas vayan a la escuela».\n\nNo tenía miedo, pero había empezado a asegurarme de que la puerta estuviera cerrada con llave por la noche y a preguntarle a Dios qué sucede después de la muerte. Le conté todo a mi mejor amiga, Moniba. Habíamos vivido en la misma calle de pequeñas y éramos amigas desde la primaria. Compartíamos canciones de Justin Bieber y películas de Crepúsculo, y las mejores cremas blanqueadoras. Moniba siempre sabía si algo andaba mal. «No te preocupes», le dije. «Los talibanes nunca han venido a por una niña pequeña».\n\nCuando llamaron a nuestro autobús, bajamos corriendo las escaleras de la escuela. El autobús era en realidad una camioneta Toyota blanca con tres bancos paralelos. Iba abarrotado con 20 chicas y tres profesoras. Yo iba sentada a la izquierda, entre Moniba y una chica llamada Shazia Ramzan, todas con nuestras carpetas de exámenes pegadas al pecho.\n\nDentro del autobús hacía calor y el ambiente era pegajoso. En la parte de atrás, donde nos sentábamos, no había ventanas, solo una lámina de plástico demasiado amarillenta para ver a través de ella. Lo único que podíamos ver hacia atrás era un pequeño trozo de cielo abierto y destellos del sol, un orbe amarillo flotando en el polvo que lo cubría todo.\n\nDe repente, nos detuvimos. Un joven barbudo se había adentrado en la carretera. —¿Es este el autobús de la escuela Khushal? —le preguntó a nuestro conductor. Usman Bhai Jan pensó que era una pregunta tonta, ya que el nombre estaba pintado en el lateral. —Sí —respondió.\n\n—Necesito información sobre unos niños —dijo el hombre. —Deberías ir a la oficina —respondió Usman Bhai Jan. Mientras hablaba, otro joven se acercó a la parte trasera de la furgoneta.\n\n—Mira, es uno de esos periodistas que vienen a pedir una entrevista —dijo Moniba—. Desde que empecé a hablar en eventos con mi padre, los periodistas solían aparecer, aunque no así, por la calle.\n\nEl hombre llevaba una gorra con visera y un pañuelo que le cubría la nariz y la boca. Luego se subió a la parte trasera del camión y se inclinó sobre nosotros. —¿Quién es Malala? —preguntó con insistencia.\n\nNadie dijo nada, pero varias chicas me miraron. Yo era la única con la cara descubierta.\n\nFue entonces cuando levantó una pistola negra. Algunas de las chicas gritaron. Moniba me dice que le apreté la mano.\n\nMis amigos dicen que disparó tres veces. La primera bala me atravesó la cuenca del ojo izquierdo y salió por debajo del hombro izquierdo. Me desplomé sobre Moniba, con sangre brotando de mi oído izquierdo, así que las otras dos balas alcanzaron a las chicas que estaban a mi lado. Una bala se alojó en la mano izquierda de Shazia. La tercera le atravesó el hombro izquierdo y se alojó en la parte superior del brazo derecho de Kainat Riaz.\n\nMis amigos me contaron después que al pistolero le temblaba la mano cuando disparó.\n\nDesperté el 16 de octubre, una semana después del tiroteo. Me habían trasladado en avión desde Pakistán al Reino Unido inconsciente y sin mis padres. Estaba a miles de kilómetros de casa, con un tubo en el cuello para ayudarme a respirar e incapaz de hablar.\n\nLo primero que pensé al despertar fue: «Gracias a Dios que no estoy muerto». Pero no tenía ni idea de dónde estaba. Sabía que no estaba en mi país. Las enfermeras y los médicos hablaban inglés, aunque todos parecían ser de países diferentes. Yo les hablaba, pero nadie podía oírme por el tubo que tenía en el cuello. Para empezar, veía muy borroso el ojo izquierdo y todos parecían tener dos narices y cuatro ojos. Un sinfín de preguntas me invadieron: ¿Dónde estaba? ¿Quién me había traído allí? ¿Dónde estaban mis padres? ¿Estaba vivo mi padre? Estaba aterrorizado. El Dr. Javid Kayani, subdirector médico de los Hospitales Universitarios de Birmingham, que se encontraba en Islamabad cuando me dispararon y gracias a quien ahora estaba en Birmingham, estaba allí cuando me despertaron y dice que jamás olvidará la expresión de miedo y desconcierto en mi rostro.\n\nMe habló en urdu. Lo único que sabía era que Alá me había bendecido con una nueva vida. Una amable señora con velo me tomó de la mano y me dijo: «Asalamu alaikum», nuestro saludo musulmán tradicional. Luego comenzó a rezar en urdu y a recitar versículos del Corán. Me dijo que se llamaba Rehanna y que era la capellana musulmana. Su voz era suave y sus palabras tranquilizadoras, y volví a dormirme.\n\nSoñé que no estaba realmente en el hospital. Cuando desperté al día siguiente, me di cuenta de que estaba en una extraña habitación verde sin ventanas y con luces muy brillantes. Era una cabina de cuidados intensivos en el Hospital Queen Elizabeth. Todo estaba limpio y reluciente, nada que ver con el hospital de mi ciudad natal, Mingora. Una enfermera me dio un lápiz y un bloc de notas, pero no podía escribir bien y las palabras salían mal. Quería escribir el número de teléfono de mi padre. No podía dejar espacio entre las letras. El Dr. Javid me trajo un tablero con el alfabeto para que pudiera señalar las letras. Las primeras palabras que deletreé fueron padre y país. La enfermera me dijo que estaba en Birmingham, pero no tenía ni idea de dónde estaba. Solo después me trajeron un atlas para que pudiera ver que estaba en Inglaterra. No sabía qué había pasado. Las enfermeras no me decían nada. Ni siquiera mi nombre. ¿Seguía siendo Malala?\n\nMe dolía tanto la cabeza que ni las inyecciones que me pusieron pudieron aliviar el dolor. Me sangraba la oreja izquierda y sentía la mano izquierda rara. Enfermeras y médicos entraban y salían constantemente. Entonces, una señora muy amable llamada Dra. Fiona vino y me dio un osito de peluche blanco. Me dijo que lo llamara Junaid y que me explicaría el motivo más tarde. [El coronel Junaid Kahn era un cirujano del ejército que me había operado del cerebro de urgencia en el hospital militar de Peshawar, donde me llevaron tras recibir un disparo en la cabeza.] No sabía quién era Junaid, así que lo llamé Lily. También me trajo un cuaderno rosa para escribir. Las dos primeras preguntas que escribí fueron: \"¿Por qué no tengo padre?\" y \"Mi padre no tiene dinero. ¿Quién pagará todo esto?\".\n\n—Tu padre está bien —respondió ella—. Está en Pakistán. No te preocupes por el pago. Repetí las preguntas a todos los que entraban. Todos decían lo mismo. Pero no me convencía. No tenía ni idea de lo que me había pasado y no confiaba en nadie. Si mi padre estaba bien, ¿por qué no estaba aquí? Creía que me habían disparado, pero no estaba segura: ¿eran sueños o recuerdos? Solo después supe que nadie debía contarme nada, ya que los médicos temían que me traumatizara.\n\nYo también estaba obsesionada con el dinero. Cada vez que veía a los médicos hablando entre ellos, pensaba que decían: «Malala no tiene dinero. Malala no puede pagar su tratamiento». Uno de los médicos era polaco y siempre parecía triste. Pensaba que era el dueño del hospital y que estaba disgustado porque yo no podía pagar. Así que le pedí papel a una enfermera y escribí: «¿Por qué está triste?». Él respondió: «No, no estoy triste». «¿Quién pagará?», escribí. «No tenemos dinero». «No se preocupe, su gobierno pagará», dijo. Después, siempre me sonreía al verme.\n\nMe preocupaba que mi padre pudiera haber muerto. Entonces Fiona trajo un periódico pakistaní de la semana anterior que tenía una fotografía de mi padre hablando con el general Kayani con una figura envuelta en un chal sentada al fondo junto a mi hermano. Apenas podía ver sus pies. «¡Esa es mi madre!», escribí. Más tarde ese día, el Dr. Javid entró con su teléfono móvil. «Vamos a llamar a tus padres», dijo. Mis ojos brillaron de emoción. «No llores, no te deprimas», me indicó. Era brusco pero muy amable, como si me conociera de toda la vida. «Te daré el móvil y sé fuerte». Asentí. Marcó el número, habló y luego me dio el teléfono.\n\nAhí estaba la voz de mi padre. No podía hablar por el tubo en mi cuello, pero me alegró mucho oírlo. No podía sonreír por mi expresión, pero era como si tuviera una sonrisa interior. «Vendré pronto», prometió. «Descansa y en dos días estaremos allí». Después me contó que el doctor Javid también le había ordenado que no llorara, pues eso nos pondría más tristes a todos. El doctor quería que fuéramos fuertes los unos para los otros.\n\nUnos días después, pedí un espejo. «Espejo», escribí en el diario rosa; quería ver mi cara y mi pelo. Las enfermeras me trajeron un pequeño espejo blanco, que aún conservo. Al verme, me sentí desolada. Mi larga melena, que solía peinar durante horas, había desaparecido, y el lado izquierdo de mi cabeza estaba completamente calvo. «Ahora tengo el pelo corto», escribí en el diario. Pensé que los talibanes me lo habían cortado. En realidad, los médicos pakistaníes me habían rapado la cabeza sin piedad. Mi rostro estaba deformado, como si alguien me lo hubiera estirado hacia abajo, y tenía una cicatriz al lado del ojo izquierdo.\n\n«¿Quién me hizo esto?», escribí, con las letras aún desordenadas. «¿Qué me pasó?». También escribí «Semáforos», ya que las luces brillantes me provocaban dolor de cabeza.\n\n\"Te ha ocurrido algo malo\", dijo la doctora Fiona.\n\n\"¿Me dispararon? ¿Le dispararon a mi padre?\", escribí.\n\nMe dijo que me habían disparado en el autobús escolar. Comentó que a dos de mis amigos también les habían disparado, pero no reconocí sus nombres. Me explicó que la bala había entrado por el costado de mi ojo izquierdo, donde tenía una cicatriz, recorrió 45 centímetros hasta mi hombro izquierdo y se detuvo allí. Podría haberme sacado el ojo o haberme alcanzado el cerebro. Fue un milagro que estuviera viva.\n\nNo sentí nada, tal vez solo un poco de satisfacción. «Así que lo hicieron». Mi único arrepentimiento era no haber tenido la oportunidad de hablar con ellos antes de que me dispararan. Ahora nunca escucharían lo que tenía que decir. Ni siquiera pensé mal del hombre que me disparó; no tenía pensamientos de venganza; solo quería volver al SWAT. Quería volver a casa.\n","locked":true,"narration":{"audioSrc":"narration.m4a","wordTimestamps":[{"word":"El","start":0,"end":0.18454902013088634},{"word":"martes","start":0.18454902013088634,"end":0.6151634004362878},{"word":"9","start":0.6151634004362878,"end":0.7381960805235454},{"word":"de","start":0.7381960805235454,"end":0.9227451006544317},{"word":"octubre","start":0.9227451006544317,"end":1.414875821003462},{"word":"de","start":1.414875821003462,"end":1.5994248411343484},{"word":"2012","start":1.5994248411343484,"end":1.9070065413524921},{"word":"no","start":1.9070065413524921,"end":2.0915555614833785},{"word":"fue","start":2.0915555614833785,"end":2.3376209216578934},{"word":"el","start":2.3376209216578934,"end":2.5221699417887797},{"word":"mejor","start":2.5221699417887797,"end":2.8912679820505525},{"word":"día","start":2.8912679820505525,"end":3.1373333422250678},{"word":"para","start":3.1373333422250678,"end":3.4449150424432116},{"word":"empezar,","start":3.4449150424432116,"end":3.9985621028358707},{"word":"ya","start":3.9985621028358707,"end":4.183111122966757},{"word":"que","start":4.183111122966757,"end":4.429176483141272},{"word":"estábamos","start":4.429176483141272,"end":5.0443398835775595},{"word":"en","start":5.0443398835775595,"end":5.228888903708445},{"word":"plena","start":5.228888903708445,"end":5.597986943970218},{"word":"época","start":5.597986943970218,"end":5.967084984231991},{"word":"de","start":5.967084984231991,"end":6.151634004362877},{"word":"exámenes;","start":6.151634004362877,"end":6.766797404799164},{"word":"aunque,","start":6.766797404799164,"end":7.258928125148195},{"word":"como","start":7.258928125148195,"end":7.566509825366339},{"word":"buena","start":7.566509825366339,"end":7.9356078656281115},{"word":
