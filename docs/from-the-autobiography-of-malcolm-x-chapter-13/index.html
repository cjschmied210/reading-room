button {

}

  background: var(--border);
  height: 4px;

  outline: none;
}

  -webkit-appearance: none;
  height: 16px;
  width: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type=range]::-moz-range-thumb {
  height: 16px;
  width: 16px;

  border-radius: 50%;

input[type=range]:focus-visible {

.wrap {

}

.topbar {

  gap: 16px;

.topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand {

.btn-ghost {

  color: var(--ink-muted);
  font-weight: 500;
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 6px;
  background: white;
  transition: color 0.15s, border-color 0.15s;
}
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
.btn-ghost.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

h1.doc-title {
  font-family: var(--font-heading);
  font-size: 42px;
  line-height: 1.15;
  margin: 28px 0;

}

.section-label {
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 12px;
  font-family: var(--font-sans);
  font-weight: 500;
}

.mode-grid {

  gap: 10px;
  margin-bottom: 28px;
}
.mode-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  padding: 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  transition: all 0.15s;
  color: var(--ink);
}
.mode-card:hover { border-color: var(--ink-muted); }

  text-transform: uppercase;

  border: 1px solid var(--border);
  color: var(--ink-muted);
  border-radius: 4px;
  font-family: var(--font-sans);

  text-transform: uppercase;
  letter-spacing: 0.08em;

.btn-secondary:hover { border-color: var(--ink); color: var(--ink); }
.progress-text { font-size: 12px; color: var(--ink-muted); font-family: var(--font-sans); min-width: 90px; }

.sliders { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-left: auto; }
.slider-label {
  display: flex; align-items: center; gap: 10px;

  color: var(--ink-muted); font-family: var(--font-sans); font-weight: 500;

.slider-label select {
  font-family: var(--font-sans);
  font-size: 12px;
  border: 1px solid var(--border);

  background: white;

.slider-value { font-size: 12px; text-transform: none; color: var(--ink); font-weight: 600; min-width: 45px; }

.stage {

  padding: 48px;
  min-height: 380px;

.stage-inner { margin: 0 auto; font-family: var(--font-body); }

.page-p { text-align: justify; -webkit-hyphens: auto; hyphens: auto; }

.word-token { display: inline-block; border-radius: 2px; padding: 0 2px; transition: all 90ms linear; }
.chunk-token { display: inline-block; border-radius: 2px; padding: 0 2px; transition: color 120ms ease, background 120ms ease; }

.word-stage {

.word-big {

  line-height: 1.1;

.hint-text { font-size: 12px; color: var(--ink-muted); font-style: italic; font-family: var(--font-sans); }

.link-btn:hover { color: var(--accent); }

.modal {

.preset-tag:hover { border-color: var(--accent); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; }

  font-size: 12px; font-family: var(--font-sans); color: var(--ink-muted);

window.__READER_DATA__ = {"title":"From The Autobiography of Malcolm X – Chapter 13","text":"I mentioned, you will remember, how in a big city, a sizable organization can remain practically unknown, unless something happens that brings it to the general public's attention. Well, certainly no one in the Nation of Islam had any anticipation of the kind of thing that would happen in Harlem one night.\n\nTwo white policemen, breaking up a street scuffle between some Negroes, ordered other Negro passers-by to \"Move on!\" Of these bystanders, two happened to be Muslim brother Johnson Hinton and another brother of Temple Seven. They didn't scatter and run the way the white cops wanted. Brother Hinton was attacked with nightsticks. His scalp was split open, and a police car came and he was taken to a nearby precinct.\n\nThe second brother telephoned our restaurant. And with some telephone calls, in less than half an hour about fifty of Temple Seven's men of the Fruit of Islam were standing in ranksformation outside the police precinct house.\n\nOther Negroes, curious, came running, and gathered in excitement behind the Muslims. The police, coming to the station house front door, and looking out of the windows, couldn't believe what they saw. I went in, as the minister of Temple Seven, and demanded to see our brother. The police first said he wasn't there. Then they admitted he was, but said I couldn't see him. I said that until he was seen, and we were sure he received proper medical attention, the Muslims would remain where they were.\n\nThey were nervous and scared of the gathering crowd outside. When I saw our Brother Hinton, it was all I could do to contain myself. He was only semiconscious. Blood had bathed his head and face and shoulder. I hope I never again have to withstand seeing another case of sheer police brutality like that.\n\nI told the lieutenant in charge, \"That man belongs in the hospital.\" They called an ambulance. When it came and Brother Hinton was taken to Harlem Hospital, we Muslims followed, in loose formations, for about fifteen blocks along Lenox Avenue, probably the busiest thoroughfare in Harlem. Negroes who never had seen anything like this were coming out of stores and restaurants and bars and enlarging the crowd following us.\n\nThe crowd was big, and angry, behind the Muslims in front of Harlem Hospital. Harlem's black people were long since sick and tired of police brutality. And they never had seen any organization of black men take a firm stand as we were.\n\nA high police official came up to me, saying \"Get those people out of there.\" I told him that our brothers were standing peacefully, disciplined perfectly, and harming no one. He told me those others, behind them, weren't disciplined. I politely told him those others were his problem.\n\nWhen doctors assured us that Brother Hinton was receiving the best of care, I gave the order and the Muslims slipped away. The other Negroes' mood was ugly, but they dispersed also, when we left. We wouldn't learn until later that a steel plate would have to be put into Brother Hinton's skull. (After that operation, the Nation of Islam helped him to sue; a jury awarded him over $70,000, the largest police brutality judgment that New York City has ever paid.)\n\nFor New York City's millions of readers of the downtown papers, it was, at that time, another one of the periodic \"Racial Unrest in Harlem\" stories. It was not played up, because of what had happened. But the police department, to be sure, pulled out and carefully studied the files on the Nation of Islam, and appraised us with new eyes. Most important, in Harlem, the world's most heavily populated black ghetto, the Amsterdam News made the whole story headline news, and for the first time the black man, woman, and child in the streets were discussing \"those Muslims.\"","locked":true,"narration":{"audioSrc":"narration.wav","wordTimestamps":[{"word":"I","start":0,"end":0.09342480381665774},{"word":"m
